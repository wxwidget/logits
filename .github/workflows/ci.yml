name: correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-and-packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test,benchmark]'
      - run: python -m pytest -q --cov=logitlab --cov-report=term-missing --cov-fail-under=95
      - run: python examples/train.py
      - run: python examples/linear_regression.py
      - run: python benchmarks/compare.py --rows 80 --cols 4 --epochs 2 --seeds 42 --output build/smoke-benchmark
      - run: python benchmarks/suite.py --quick --cases dense_control --seeds 42 --epochs 2 --repeats 1 --output build/protocol-check
      - run: python benchmarks/report.py --input build/protocol-check --output build/protocol-report
      - run: python benchmarks/linear_suite.py --quick --cases dense_control --seeds 42 --max-iter 2 --repeats 1 --output build/linear-protocol
      - run: python benchmarks/linear_report.py --input build/linear-protocol --output build/linear-report
      - run: python -m build --sdist
      - run: python -m pip wheel --no-deps dist/logitlab-*.tar.gz -w dist
      - run: python -m pip install --force-reinstall --no-deps dist/logitlab-*.whl
      - run: cd /tmp && python -c 'import logitlab; m=logitlab.LogisticRegression(l2=.1).fit([[-1.],[1.]],[0.,1.]); assert list(m.predict([[-1.],[1.]])) == [0,1]'
      - run: python -m pytest -q
  cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: ['g++', 'clang++']
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DLOGITLAB_LEGACY=ON
      - run: cmake --build build/ci --parallel 2
      - run: ctest --test-dir build/ci --output-on-failure
      - run: ./build/ci/legacy_lr data/train.csv data/trainLabels.csv 1000 40
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
      - run: cmake --build build/asan --parallel 2
      - run: ctest --test-dir build/asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
